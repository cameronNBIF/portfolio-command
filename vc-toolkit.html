<style>
:root {
  color-scheme: light;
  --navy: #16263f; --navy-2: #1f3355; --ink: #1c2430; --slate: #5b6878; --muted: #8a95a5;
  --line: #dde3ea; --line-soft: #eaeef3; --bg: #f4f6f9; --card: #ffffff;
  --accent: #2563eb; --accent-soft: #eaf1fe;
  --green: #15803d; --green-bg: #e8f5ec; --amber: #b45309; --amber-bg: #fdf3e3; --red: #b91c1c; --red-bg: #fdeaea;
  --teal: #0e7490; --purple: #7c3aed;
  --radius: 8px;
  --shadow: 0 1px 2px rgba(22,38,63,.06), 0 1px 6px rgba(22,38,63,.05);
  --font: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "SF Mono", "Cascadia Code", Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 13px; }
#app { display: flex; flex-direction: column; height: 100vh; }

/* ---------- Top bar ---------- */
header { background: var(--navy); color: #fff; display: flex; align-items: center; gap: 18px; padding: 0 18px; height: 52px; flex-shrink: 0; }
header .logo { font-weight: 700; font-size: 14.5px; letter-spacing: .3px; white-space: nowrap; }
header .logo span { color: #7fb0ff; }
nav { display: flex; gap: 2px; height: 100%; }
nav button { background: none; border: none; color: #b8c4d6; font: 600 12.5px var(--font); padding: 0 14px; cursor: pointer; border-bottom: 2.5px solid transparent; height: 100%; }
nav button:hover { color: #fff; }
nav button.active { color: #fff; border-bottom-color: #7fb0ff; }
header .spacer { flex: 1; }
header .fundtag { font-size: 11.5px; color: #b8c4d6; text-align: right; line-height: 1.3; }
header .fundtag b { color: #fff; }

main { flex: 1; overflow-y: auto; padding: 18px 22px 40px; }
.view { display: none; max-width: 1400px; margin: 0 auto; }
.view.active { display: block; }

/* ---------- Generic ---------- */
h2.vtitle { font-size: 17px; font-weight: 700; margin-bottom: 2px; }
.vsub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card .chead { padding: 10px 14px; border-bottom: 1px solid var(--line-soft); font-weight: 700; font-size: 12.5px; display: flex; align-items: center; justify-content: space-between; }
.card .cbody { padding: 12px 14px; }
.grid { display: grid; gap: 14px; }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; text-align: right; }
.up { color: var(--green); } .down { color: var(--red); } .flat { color: var(--muted); }
.small { font-size: 11.5px; color: var(--slate); }
.hint { font-size: 11px; color: var(--muted); }
a.link { color: var(--accent); cursor: pointer; text-decoration: none; }
a.link:hover { text-decoration: underline; }

.btn { background: var(--navy); color: #fff; border: none; border-radius: 6px; padding: 7px 13px; font: 600 12px var(--font); cursor: pointer; }
.btn:hover { background: var(--navy-2); }
.btn.ghost { background: #fff; color: var(--navy); border: 1px solid var(--line); }
.btn.ghost:hover { background: var(--bg); }
.btn.sm { padding: 4px 9px; font-size: 11.5px; }
.btn.danger { background: var(--red); }

.pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 10.5px; font-weight: 700; letter-spacing: .2px; white-space: nowrap; }
.pill.green { background: var(--green-bg); color: var(--green); }
.pill.yellow { background: var(--amber-bg); color: var(--amber); }
.pill.red { background: var(--red-bg); color: var(--red); }
.pill.gray { background: #eef1f5; color: var(--slate); }
.pill.blue { background: var(--accent-soft); color: var(--accent); }
.pill.purple { background: #f1eafd; color: var(--purple); }
.pill.teal { background: #e0f2f7; color: var(--teal); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: baseline; }
.dot.green { background: #22a052; } .dot.yellow { background: #e09a1a; } .dot.red { background: #d93030; } .dot.gray { background: #9aa5b3; }

/* ---------- KPI tiles ---------- */
.kpirow { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 13px; box-shadow: var(--shadow); }
.kpi .k { font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.kpi .v { font-size: 20px; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 11px; color: var(--slate); margin-top: 2px; }

/* ---------- Tables ---------- */
table.dt { width: 100%; border-collapse: collapse; font-size: 12.3px; }
table.dt th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--card); z-index: 1; }
table.dt th.num { text-align: right; }
table.dt th .arrow { font-size: 9px; color: var(--accent); }
table.dt td { padding: 7px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
table.dt tbody tr:hover { background: #f6f9fd; }
table.dt tbody tr.click { cursor: pointer; }
.tblwrap { overflow: auto; max-height: 640px; }

/* ---------- Filters ---------- */
.fbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.fbar input[type=text], .fbar select, .field input, .field select, .field textarea {
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font: 12.3px var(--font); background: #fff; color: var(--ink);
}
.fbar input[type=text]:focus, .fbar select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.fbar .count { margin-left: auto; font-size: 11.5px; color: var(--muted); }

/* ---------- Charts ---------- */
.chartbox { position: relative; height: 240px; }
.chartbox.tall { height: 300px; }

/* ---------- Detail drawer ---------- */
#drawer { position: fixed; top: 0; right: -900px; width: min(880px, 96vw); height: 100vh; background: #fff; border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(22,38,63,.18); z-index: 50; transition: right .22s ease; display: flex; flex-direction: column; }
#drawer.open { right: 0; }
#drawer .dhead { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 12px; }
#drawer .dbody { flex: 1; overflow-y: auto; padding: 16px 20px 40px; }
#overlay { position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 40; display: none; }
#overlay.open { display: block; }
.dsec { margin-bottom: 18px; }
.dsec h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 7px; padding-bottom: 4px; border-bottom: 1px solid var(--line-soft); }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 16px; }
.kv .item .l { font-size: 10.5px; color: var(--muted); font-weight: 600; }
.kv .item .d { font-size: 12.5px; font-weight: 600; margin-top: 1px; }

/* ---------- Pipeline ---------- */
.kanban { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; align-items: start; }
.kcol { background: #edf0f4; border-radius: var(--radius); padding: 8px; min-height: 120px; }
.kcol h5 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--slate); padding: 2px 4px 8px; display: flex; justify-content: space-between; }
.kcard { background: #fff; border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; box-shadow: var(--shadow); }
.kcard:hover { border-color: var(--accent); }
.kcard .n { font-weight: 700; font-size: 12.3px; }
.kcard .m { font-size: 11px; color: var(--slate); margin-top: 2px; }

/* ---------- Memo ---------- */
.memolayout { display: grid; grid-template-columns: 300px 1fr; gap: 14px; align-items: start; }
.memosec { margin-bottom: 14px; }
.memosec label { font-size: 11px; font-weight: 700; color: var(--slate); text-transform: uppercase; letter-spacing: .4px; display: block; margin-bottom: 4px; }
.memosec textarea { width: 100%; min-height: 84px; resize: vertical; font: 12.5px/1.5 var(--font); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.gate { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--line-soft); }
.gate select { font-size: 11px; padding: 3px 5px; border: 1px solid var(--line); border-radius: 5px; }

/* ---------- Data view ---------- */
pre.schema { background: #0f172a; color: #cfe0f4; font: 11px/1.55 var(--mono); padding: 14px 16px; border-radius: var(--radius); overflow-x: auto; }
.droptarget { border: 2px dashed var(--line); border-radius: var(--radius); padding: 18px; text-align: center; color: var(--muted); }

/* ---------- Report / print ---------- */
.reporthead { display: none; }
@media print {
  header, .fbar, .btn, nav, .noprint { display: none !important; }
  main { padding: 0; overflow: visible; }
  body { background: #fff; }
  .view { display: none; } .view.active { display: block; }
  .reporthead { display: block; margin-bottom: 12px; }
  .card { box-shadow: none; break-inside: avoid; }
}
.badgebar { display: flex; gap: 6px; flex-wrap: wrap; }
.progress { height: 7px; background: var(--line-soft); border-radius: 99px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); border-radius: 99px; }
.alertrow { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line-soft); font-size: 12.3px; }
.tabs2 { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.tabs2 button { background: none; border: none; padding: 7px 12px; font: 600 12px var(--font); color: var(--slate); cursor: pointer; border-bottom: 2px solid transparent; }
.tabs2 button.active { color: var(--accent); border-bottom-color: var(--accent); }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 12.5px; z-index: 99; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>

const NAME_B = ["Analytics","Systems","Health","Robotics","Security","Grid","Bio","Software","Networks","Dynamics","Materials","Therapeutics","Data","Aero","Capital OS","Logistics","AI","Labs","Energy","Platforms","Sensing","Mobility","Compute","Diagnostics"];

function generatedCompanies(n){
  const out=[]; const usedNames=new Set(detailedCompanies().map(c=>c.name));
  let i=0, idn=13;
  while(out.length<n){
    i++;
    const name = pick(NAME_A)+" "+pick(NAME_B);
    if(usedNames.has(name)) continue; usedNames.add(name);
    const vintage = rndi(2019,2025);
    const stage = pick(STAGES.slice(0, vintage>=2024?3:6));
    const sector = pick(SECTORS);
    const instrument = pick(INSTRUMENTS);
    const invested = +(rnd(0.5, stage==="Growth"||stage==="Series C+"?12: stage==="Series B"?9: stage==="Series A"?7:3)).toFixed(1);
    const exited = rng()<0.10;
    const writeoff = exited && rng()<0.45;
    const moic = writeoff?0: exited? rnd(1.2,3.8) : Math.max(0.1, rnd(0.4,1.0)<0.15? rnd(0.1,0.6) : rnd(0.7, vintage<=2021?3.4:2.2));
    const fmv = exited?0: +(invested*moic).toFixed(1);
    const realized = exited && !writeoff ? +(invested*moic).toFixed(1) : 0;
    const healthRoll = rng();
    const health = exited ? (writeoff?"red":"green") : moic<0.7||healthRoll<0.10 ? "red" : moic<1.0||healthRoll<0.32 ? "yellow" : "green";
    const revenue = +(rnd(0.2, stage==="Growth"?60: stage==="Series C+"?45: stage==="Series B"?25: stage==="Series A"?9:2)).toFixed(1);
    const burn = +(rnd(0.1, 1.8)).toFixed(2);
    const cash = +(rnd(2, 40)).toFixed(1);
    const runwayMo = burn>0? Math.min(99, Math.round(cash/burn)) : 99;
    const flags=[];
    if(!exited){
      if(runwayMo<12) flags.push("Runway below 12 months");
      if(health==="red"&&rng()<0.6) flags.push(pick(["Down-round likely","Key-person risk","Covenant watch","Pipeline slippage"]));
      if(health==="yellow"&&rng()<0.4) flags.push(pick(["Burn above plan","Customer concentration","Hiring behind plan"]));
    }
    const ownershipPct = exited?0: +(rnd(3, 16)).toFixed(1);
    const seatRoll = rng();
    const govRoll = rng();
    out.push({
      id:"C"+String(idn++).padStart(3,"0"), name, sector, stage, vintage, health,
      instrument, ownershipPct, invested, fmv, realized, exited,
      exitDate: exited? `${vintage+rndi(2,5)}-0${rndi(1,9)}-15`:undefined,
      exitType: exited? (writeoff?"Shutdown / write-off":"Acquisition"):undefined,
      ceo: exited?"-":pick(["A.","B.","C.","D.","E.","J.","K.","L.","M.","N.","R.","S.","T."])+" "+pick(["Alvarez","Bishop","Cole","Duran","Egan","Fischer","Grant","Huang","Iqbal","Jensen","Kim","Lombardi","Moreau","Nakamura","Osei","Petrov","Quinn","Rossi","Singh","Tanaka"]),
      hq: pick(["Fredericton, NB","Fredericton, NB","Moncton, NB","Moncton, NB","Saint John, NB","Saint John, NB","Sackville, NB","Bathurst, NB","Miramichi, NB","Halifax, NS","Charlottetown, PE","Toronto, ON"]),
      source: pick(SOURCES),
      desc:"", riskFlags:flags, proRata: rng()<0.7,
      reservesAllocated: exited?0:+(rnd(0,invested*0.7)).toFixed(1), reservesDeployed:0,
      board:{seat: exited?"None": seatRoll<0.25?"Director": seatRoll<0.5?"Observer":"None", holder: seatRoll<0.5?pick(["Daniel Armali","J. Chen","K. Patel","R. Osei"]):"-", nextMeeting: !exited&&seatRoll<0.5? `2026-${String(rndi(7,12)).padStart(2,"0")}-${String(rndi(1,28)).padStart(2,"0")}`:null},
      kpis: exited?[]:[{period:"2026-Q1", revenue, burn, cash, runwayMo}],
      thresholds:{minRunwayMo:12, maxBurnMult:1.5},
      fte: exited?0: rndi(5, stage==="Growth"?300: stage==="Series C+"?220: stage==="Series B"?120: stage==="Series A"?55:20),
      fteAtEntry: exited?0: rndi(3, 30),
      fteNB: 0, womenCSuite: exited?0: rndi(0,3), cSuiteSize: exited?0: rndi(3,6),
      rounds:[{date:`${vintage}-${String(rndi(1,12)).padStart(2,"0")}-15`, label: stage==="Pre-Seed"||stage==="Seed"?"Seed":stage, instrument, invested, roundTotal:+(invested*rnd(1.8,4.5)).toFixed(1), postMoney: instrument==="SAFE"||instrument==="Convertible Note"?null:+(invested/(ownershipPct||8)*100).toFixed(0), ownershipAfter: ownershipPct||rnd(5,15), lead: rng()<0.4?"Us":pick(["Meridian Growth","Latitude Ventures","Granite Capital","Helix Partners","Foundry Industrial"]), note:""}],
      milestones:[], covenants:[],
      govFunding: govRoll<0.12? {program:pick(["SBIR Phase II","DOE grant","NSF award","EDC facility"]), amount:+(rnd(0.5,8)).toFixed(1), conditions:"Milestone reporting", status:"active"}:null,
      marks:[{date:"2026-03-31", fmv, method: exited?(writeoff?"Write-off":"Realized"):pick(["Last round","Revenue multiple","Calibrated last round","Scenario-weighted"]), by:pick(["D. Armali","K. Patel"]), rationale:"Quarterly mark per valuation policy."}],
      tasks:[]
    });
  }
  out.forEach(c=>{
    c.fteNB = c.exited?0: Math.round(c.fte * (/, NB$/.test(c.hq)? rnd(0.65,0.95) : rnd(0.3,0.6)));
    c.womenCSuite = Math.min(c.womenCSuite, c.cSuiteSize);
    c.rounds.forEach(r=>{ const other=Math.max(0,(r.roundTotal||0)-r.invested); r.nbOther = +(other*rnd(0.05,0.45)).toFixed(1); });
  });
  return out;
}

const fmt = {
  m: v => v==null||isNaN(v) ? "-" : "$"+(Math.abs(v)>=1000? (v/1000).toFixed(2)+"B" : v.toFixed(1)+"M"),
  x: v => v==null||isNaN(v)||!isFinite(v) ? "-" : v.toFixed(2)+"x",
  pct: v => v==null||isNaN(v) ? "-" : v.toFixed(1)+"%",
  pct0: v => v==null||isNaN(v) ? "-" : Math.round(v)+"%",
  d: s => s? s : "-"
};
function moic(c){ const cost=c.invested; return cost>0? (c.fmv + c.realized)/cost : null; }
function activeCompanies(){ return DB.companies.filter(c=>!c.exited); }
function isEvergreen(){ return DB.fund.style==="evergreen"; }

function fundMetrics(){
  const cs = DB.companies;
  const invested = cs.reduce((s,c)=>s+c.invested,0);
  const fmv = cs.reduce((s,c)=>s+c.fmv,0);
  const realized = cs.reduce((s,c)=>s+c.realized,0);
  const distributions = DB.fund.distributions.reduce((s,d)=>s+d.amount,0);
  const paidIn = invested; // assumption: paid-in proxied by invested cost (fee treatment noted in Data tab)
  const tvpi = paidIn>0? (fmv+distributions)/paidIn : null;
  const dpi = paidIn>0? distributions/paidIn : null;
  const rvpi = paidIn>0? fmv/paidIn : null;
  // Gross IRR from dated cash flows: -investments, +distributions, +NAV today
  const flows=[];
  cs.forEach(c=>c.rounds.forEach(r=>flows.push({date:new Date(r.date), amt:-r.invested})));
  DB.fund.distributions.forEach(d=>flows.push({date:new Date(d.date), amt:d.amount}));
  flows.push({date:new Date(), amt:fmv});
  const grossIRR = xirr(flows);
  const netIRR = grossIRR!=null? grossIRR - DB.fund.feeDragPct : null; // both in percentage points
  const netDeployed = invested - distributions; // evergreen: realized proceeds recycle into the capital base
  const dryPowder = (isEvergreen()? (DB.fund.capitalBase||0) : (DB.fund.committed||0)) - netDeployed;
  // Leverage: third-party capital in rounds we participated in, per our dollar
  let roundsTotal=0, oursInRounds=0;
  cs.forEach(c=>c.rounds.forEach(r=>{ if(r.roundTotal && r.roundTotal>=r.invested){ roundsTotal+=r.roundTotal; oursInRounds+=r.invested; } }));
  const leverage = oursInRounds>0? (roundsTotal-oursInRounds)/oursInRounds : null;
  const capitalAttracted = roundsTotal-oursInRounds;
  // FMV growth from quarterly NAV history
  const nh = DB.fund.navHistory||[];
  const nhLast = nh[nh.length-1], nhPrev = nh[nh.length-2], nhYoY = nh[nh.length-5];
  const fmvQoQ = nhLast&&nhPrev&&nhPrev.nav>0? (nhLast.nav/nhPrev.nav-1)*100 : null;
  const fmvYoY = nhLast&&nhYoY&&nhYoY.nav>0? (nhLast.nav/nhYoY.nav-1)*100 : null;
  const organicYoY = nhLast&&nhYoY? (nhLast.nav-nhYoY.nav)-(nhLast.cost-nhYoY.cost) : null; // value creation net of new capital
  // NB co-investment: of third-party capital, how much is NB-based (separate from ours)
  let nbCapital=0;
  cs.forEach(c=>c.rounds.forEach(r=>{ if(r.nbOther) nbCapital+=r.nbOther; }));
  const outsideCapital = Math.max(0, capitalAttracted - nbCapital);
  // Employment: total and in-NB
  const fte = cs.reduce((s,c)=>s+(c.fte||0),0);
  const fteAtEntry = cs.reduce((s,c)=>s+(c.fteAtEntry||0),0);
  const fteNB = cs.reduce((s,c)=>s+(c.fteNB||0),0);
  // Diversity: women in C-suite (portfolio companies)
  const actC = cs.filter(c=>!c.exited);
  const womenCos = actC.filter(c=>(c.womenCSuite||0)>0).length;
  const womenCosPct = actC.length? womenCos/actC.length*100 : null;
  const womenExecs = actC.reduce((s,c)=>s+(c.womenCSuite||0),0);
  const cSuiteTotal = actC.reduce((s,c)=>s+(c.cSuiteSize||0),0);
  // Underlying revenue: run-rate + same-store growth (companies with 2+ KPI periods)
  const revenue = actC.reduce((s,c)=>s+((c.kpis&&c.kpis[0]&&c.kpis[0].revenue)||0),0);
  let revNow=0, revPrev=0;
  actC.forEach(c=>{ if(c.kpis&&c.kpis.length>1){ revNow+=c.kpis[0].revenue; revPrev+=c.kpis[1].revenue; } });
  const revQoQ = revPrev>0? (revNow/revPrev-1)*100 : null;
  return { invested, fmv, realized, distributions, tvpi, dpi, rvpi, grossIRR, netIRR, netDeployed, dryPowder,
    leverage, capitalAttracted, roundsTotal, nbCapital, outsideCapital, fmvQoQ, fmvYoY, organicYoY,
    fte, fteAtEntry, fteNB, womenCos, womenCosPct, womenExecs, cSuiteTotal, revenue, revQoQ,
    nActive: cs.filter(c=>!c.exited).length, nExited: cs.filter(c=>c.exited).length,
    unrealizedGL: fmv - cs.filter(c=>!c.exited).reduce((s,c)=>s+c.invested,0) };
}
function xirr(flows){
  if(flows.length<2) return null;
  const t0 = Math.min(...flows.map(f=>f.date.getTime()));
  const yrs = f => (f.date.getTime()-t0)/(365.25*24*3600*1000);
  const npv = r => flows.reduce((s,f)=> s + f.amt/Math.pow(1+r, yrs(f)), 0);
  let lo=-0.95, hi=10;
  if(npv(lo)*npv(hi)>0) return null;
  for(let i=0;i<120;i++){ const mid=(lo+hi)/2; (npv(lo)*npv(mid)<=0)? hi=mid : lo=mid; }
  return ((lo+hi)/2)*100;
}
function healthAlerts(){
  const out=[];
  activeCompanies().forEach(c=>{
    const k = c.kpis && c.kpis[0];
    if(k && c.thresholds && c.thresholds.minRunwayMo && k.runwayMo < c.thresholds.minRunwayMo)
      out.push({c, sev: k.runwayMo<6?"red":"yellow", text:`Runway ${k.runwayMo} mo (threshold ${c.thresholds.minRunwayMo})`});
    (c.riskFlags||[]).forEach(f=>{ if(!/Runway/i.test(f)) out.push({c, sev: c.health==="red"?"red":"yellow", text:f}); });
    (c.covenants||[]).forEach(cv=>{ if(/breach|watch/i.test(cv.status)) out.push({c, sev:/breach/i.test(cv.status)?"red":"yellow", text:"Covenant: "+cv.text+" ("+cv.status+")"}); });
    if(c.govFunding && /pending|risk/i.test(c.govFunding.status)) out.push({c, sev:"yellow", text:"Gov funding: "+c.govFunding.program+" - "+c.govFunding.status});
  });
  return out.sort((a,b)=> (a.sev==="red"?0:1)-(b.sev==="red"?0:1));
}

function groupSum(arr, keyFn, valFn){ const g={}; arr.forEach(x=>{ const k=keyFn(x); g[k]=(g[k]||0)+valFn(x); }); return g; }
function drawDashboardCharts(m){
  const act = activeCompanies();

  const costS = groupSum(act, c=>c.sector, c=>c.invested), fmvS = groupSum(act, c=>c.sector, c=>c.fmv);

      {label:"Cost", data:secs.map(s=>costS[s]), backgroundColor:"#9db3d4"},
      {label:"FMV", data:secs.map(s=>fmvS[s]||0), backgroundColor:"#2563eb"}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:"top"}}, scales:{y:{title:{display:true,text:"$M"}}}}});
  // FMV growth trajectory
  const nh = DB.fund.navHistory||[];
  if(nh.length){

      options:{responsive:true,maintainAspectRatio:false, plugins:{legend:{position:"top"}}, scales:{y:{title:{display:true,text:"$M"}}}}});
  }
  // Capital attracted (leverage) by year: ours vs NB co-investment vs outside capital
  const lev={};
  DB.companies.forEach(c=>c.rounds.forEach(r=>{ if(!r.roundTotal || r.roundTotal<r.invested) return; const y=r.date.slice(0,4);
    lev[y]=lev[y]||{ours:0,nb:0,out:0}; const other=r.roundTotal-r.invested; const nb=Math.min(other, r.nbOther||0);
    lev[y].ours+=r.invested; lev[y].nb+=nb; lev[y].out+=other-nb; }));
  const lys=Object.keys(lev).sort();
  makeChart("ch-leverage",{type:"bar", data:{labels:lys, datasets:[
    {label:"Our capital", data:lys.map(y=>+lev[y].ours.toFixed(1)), backgroundColor:"#16263f", stack:"a"},
    {label:"Other NB capital", data:lys.map(y=>+lev[y].nb.toFixed(1)), backgroundColor:"#7c3aed", stack:"a"},
    {label:"Outside capital attracted", data:lys.map(y=>+lev[y].out.toFixed(1)), backgroundColor:"#0e7490", stack:"a"}]},
    options:{responsive:true,maintainAspectRatio:false, plugins:{legend:{position:"top"}}, scales:{x:{stacked:true}, y:{stacked:true, title:{display:true,text:"$M per round year"}}}}});
  // Sourcing channels (active portfolio, count of companies)
  const src={}; act.forEach(c=>{ const s=c.source||"Unrecorded"; src[s]=(src[s]||0)+1; });
  const sks=Object.keys(src).sort((a,b)=>src[b]-src[a]);
  makeChart("ch-sourcing",{type:"bar", data:{labels:sks, datasets:[{data:sks.map(k=>src[k]), backgroundColor:"#2563eb"}]},
    options:{indexAxis:"y", responsive:true,maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{ticks:{precision:0}, title:{display:true,text:"# active companies"}}}}});
  // MOIC histogram
  const bins=["<0.5x","0.5-1x","1-1.5x","1.5-2x","2-3x","3x+"];
  const counts=[0,0,0,0,0,0];
  act.forEach(c=>{ const mo=moic(c); if(mo==null)return; counts[mo<0.5?0:mo<1?1:mo<1.5?2:mo<2?3:mo<3?4:5]++; });
  makeChart("ch-moic",{type:"bar", data:{labels:bins, datasets:[{data:counts, backgroundColor:["#b91c1c","#e09a1a","#94a3b8","#60a5fa","#2563eb","#15803d"]}]},
    options:{responsive:true,maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{ticks:{precision:0}, title:{display:true,text:"# companies"}}}}});
  // Vintage
  const vys=[...new Set(DB.companies.map(c=>c.vintage))].sort();
  const vm = vys.map(y=>{ const g=DB.companies.filter(c=>c.vintage===y); const inv=g.reduce((s,c)=>s+c.invested,0); const val=g.reduce((s,c)=>s+c.fmv+c.realized,0); return inv>0?val/inv:0; });
  makeChart("ch-vintage",{type:"bar", data:{labels:vys, datasets:[{label:"Gross MOIC", data:vm, backgroundColor:vm.map(x=>x>=1.5?"#15803d":x>=1?"#2563eb":"#b45309")}]},
    options:{responsive:true,maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{title:{display:true,text:"MOIC (x)"}}}}});
  // J-curve: quarterly cumulative net CF + NAV growth approximation
  const flows=[];
  DB.companies.forEach(c=>c.rounds.forEach(r=>flows.push({t:new Date(r.date).getTime(), amt:-r.invested})));
  DB.fund.distributions.forEach(d=>flows.push({t:new Date(d.date).getTime(), amt:d.amount}));
  flows.sort((a,b)=>a.t-b.t);
  const qs=[]; const start=new Date(2019,0,1); const now=new Date();
  for(let d=new Date(start); d<=now; d.setMonth(d.getMonth()+3)) qs.push(new Date(d));
  const totalFmv = m.fmv;
  const totalInvested = m.invested;
  const jdata = qs.map(q=>{
    const cum = flows.filter(f=>f.t<=q.getTime()).reduce((s,f)=>s+f.amt,0);
    const investedSoFar = flows.filter(f=>f.t<=q.getTime()&&f.amt<0).reduce((s,f)=>s-f.amt,0);
    const frac = totalInvested>0? investedSoFar/totalInvested:0;
    const elapsedYrs = (q - start)/(365.25*24*3600*1000);
    const navApprox = investedSoFar * Math.min(totalFmv/Math.max(totalInvested,1), 1+ (totalFmv/Math.max(totalInvested,1)-1)*Math.min(elapsedYrs/6,1));
    return { label:q.getFullYear()+"-Q"+(Math.floor(q.getMonth()/3)+1), net:cum, tv:cum+navApprox };
  });
  makeChart("ch-jcurve",{type:"line", data:{labels:jdata.map(d=>d.label), datasets:[
      {label:isEvergreen()?"Net deployment (cost less realizations)":"Net cash flow", data:jdata.map(d=>d.net), borderColor:"#b45309", backgroundColor:"transparent", tension:.3, pointRadius:0, borderWidth:2},
      {label:"Net CF + NAV (est.)", data:jdata.map(d=>d.tv), borderColor:"#2563eb", backgroundColor:"rgba(37,99,235,.08)", fill:true, tension:.3, pointRadius:0, borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false, plugins:{legend:{position:"top"}}, scales:{x:{ticks:{maxTicksLimit:8}}, y:{title:{display:true,text:"$M"}}}}});
  // Donuts
  const donut=(id,g)=>{ const ks=Object.keys(g).sort((a,b)=>g[b]-g[a]); makeChart(id,{type:"doughnut", data:{labels:ks, datasets:[{data:ks.map(k=>g[k]), backgroundColor:PALETTE, borderWidth:1}]}, options:{responsive:true,maintainAspectRatio:false, cutout:"60%", plugins:{legend:{position:"right", labels:{boxWidth:10, font:{size:10}}}}}}); };
  donut("ch-sector", groupSum(act, c=>c.sector, c=>c.fmv));
  donut("ch-stage", groupSum(act, c=>c.stage, c=>c.fmv));
  // Top/bottom
  const ranked=[...act].sort((a,b)=>(b.fmv-b.invested)-(a.fmv-a.invested));
  const tb=[...ranked.slice(0,6), ...ranked.slice(-4)];
  makeChart("ch-topbottom",{type:"bar", data:{labels:tb.map(c=>c.name), datasets:[{data:tb.map(c=>+(c.fmv-c.invested).toFixed(1)), backgroundColor:tb.map(c=>c.fmv>=c.invested?"#15803d":"#b91c1c")}]},
    options:{indexAxis:"y", responsive:true,maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{title:{display:true,text:"Unrealized G/L ($M)"}}}}});
}

function pfFiltered(){
  let cs = DB.companies.filter(c=> PF.show==="all" ? true : PF.show==="exited" ? c.exited : !c.exited);
  const q = PF.q.trim().toLowerCase();
  if(q) cs = cs.filter(c=> (c.name+" "+c.ceo+" "+c.hq+" "+c.sector).toLowerCase().includes(q));
  if(PF.sector) cs = cs.filter(c=>c.sector===PF.sector);
  if(PF.stage) cs = cs.filter(c=>c.stage===PF.stage);
  if(PF.health) cs = cs.filter(c=>c.health===PF.health);
  if(PF.instrument) cs = cs.filter(c=>c.instrument===PF.instrument);
  const dir = PF.sortDir;
  const key = PF.sortKey;
  cs.sort((a,b)=>{
    let av, bv;
    if(key==="moic"){ av=moic(a)??-1; bv=moic(b)??-1; }
    else if(key==="gl"){ av=a.fmv+a.realized-a.invested; bv=b.fmv+b.realized-b.invested; }
    else if(key==="runway"){ av=a.kpis[0]?.runwayMo??999; bv=b.kpis[0]?.runwayMo??999; }
    else if(key==="revenue"){ av=a.kpis[0]?.revenue??-1; bv=b.kpis[0]?.revenue??-1; }
    else { av=a[key]; bv=b[key]; }
    if(typeof av==="string") return dir * av.localeCompare(bv);
    return dir * ((av||0)-(bv||0));
  });
  return cs;
}
function pfSort(key){ if(PF.sortKey===key) PF.sortDir*=-1; else { PF.sortKey=key; PF.sortDir=-1; } renderPortfolioTable(); }
function renderPortfolioTable(){
  const cs = pfFiltered();
  $("#pf-count").textContent = cs.length+" companies - cost "+fmt.m(cs.reduce((s,c)=>s+c.invested,0))+" - FMV "+fmt.m(cs.reduce((s,c)=>s+c.fmv,0));

function fiTvpi(f){ return f.called>0? (f.nav+f.distributions)/f.called : null; }
function fiDpi(f){ return f.called>0? f.distributions/f.called : null; }
function fiIrr(f){
  const flows=(f.cashflows||[]).map(c=>({date:new Date(c.date), amt:c.amount}));
  if(!flows.length) return null;
  flows.push({date:new Date(), amt:f.nav});
  return xirr(flows);
}
function fiMetrics(){
  const fs = DB.fundInvestments||[];
  const committed = fs.reduce((s,f)=>s+f.committed,0);
  const called = fs.reduce((s,f)=>s+f.called,0);
  const distributions = fs.reduce((s,f)=>s+f.distributions,0);
  const nav = fs.reduce((s,f)=>s+f.nav,0);
  const flows=[]; fs.forEach(f=>(f.cashflows||[]).forEach(c=>flows.push({date:new Date(c.date), amt:c.amount})));
  flows.push({date:new Date(), amt:nav});
  return { n:fs.length, committed, called, unfunded:committed-called, distributions, nav,
    tvpi: called>0?(nav+distributions)/called:null, dpi: called>0?distributions/called:null, rvpi: called>0?nav/called:null,
    irr: flows.length>1? xirr(flows):null,
    coInvests: fs.reduce((s,f)=>s+(f.coInvestsDone||0),0), referrals: fs.reduce((s,f)=>s+(f.referrals||0),0),
    toDirect: fs.reduce((s,f)=>s+(f.capitalToDirect||0),0),
    womenGPs: fs.filter(f=>f.womenSeniorGP).length };
}

      <div class="kpi"><div class="k">TVPI</div><div class="v">${fmt.x(fm.tvpi)}</div><div class="s">DPI ${fmt.x(fm.dpi)} / RVPI ${fmt.x(fm.rvpi)}</div></div>

      <div class="kpi"><div class="k">Women in GP Leadership</div><div class="v">${fm.womenGPs} / ${fm.n}</div><div class="s">Positions with women senior partners</div></div>

  return [...DB.pipeline.filter(d=>d.funnel!=="Passed").map(d=>({id:d.id, label:d.name+" (pipeline - "+d.funnel+")"})),

function prefillMemo(id){
  const c = DB.companies.find(x=>x.id===id);
  const d = DB.pipeline.find(x=>x.id===id);
  const m = {};
  if(c){
    const mo=moic(c), k=c.kpis&&c.kpis[0];
    m.exec = `${c.name} (${c.sector}, ${c.stage}) - follow-on / update memo. Current position: ${fmt.m(c.invested)} invested at ${fmt.pct(c.ownershipPct)} ownership via ${c.instrument}; marked at ${fmt.m(c.fmv)} (${fmt.x(mo)} MOIC). Health: ${c.health.toUpperCase()}${c.riskFlags.length? " - flags: "+c.riskFlags.join("; "):""}.`;
    m.traction = k? `Latest (${k.period}): revenue ${fmt.m(k.revenue)} run-rate, monthly burn ${k.burn<0?"cash-flow positive":fmt.m(k.burn)}, cash ${fmt.m(k.cash)}, runway ${k.runwayMo>=99?"99+":k.runwayMo} months.` : "";
    m.terms = c.rounds.map(r=>`${r.date} ${r.label}: ${fmt.m(r.invested)} via ${r.instrument}${r.postMoney?" at "+fmt.m(r.postMoney)+" post":""} (lead: ${r.lead})${r.note?" - "+r.note:""}`).join("\n");
    m.captable = `Current ownership ${fmt.pct(c.ownershipPct)} (${c.instrument}). Pro-rata rights: ${c.proRata?"yes":"no"}. Reserves: ${fmt.m(c.reservesAllocated)} allocated, ${fmt.m((c.reservesAllocated||0)-(c.reservesDeployed||0))} remaining. Board: ${c.board.seat}${c.board.seat!=="None"?" ("+c.board.holder+")":""}.`;
    m.risks = (c.riskFlags||[]).map(f=>"- "+f).join("\n") + (c.covenants||[]).map(cv=>"\n- Covenant: "+cv.text+" ["+cv.status+"]").join("") + (c.govFunding? "\n- Gov funding condition: "+c.govFunding.program+" - "+c.govFunding.conditions:"");
    m.returns = `Entry basis ${fmt.m(c.invested)}; current mark ${fmt.m(c.fmv)} (${fmt.x(mo)}). Scenario grid to complete: bear / base / bull exit values, expected proceeds at current ownership ${fmt.pct(c.ownershipPct)} (before future dilution).`;
    m.thesis = c.desc||"";
  } else if(d){
    m.exec = `${d.name} (${d.sector}) - new platform investment. Proposed ${fmt.m(d.checkSize)}${d.valuation?" at "+fmt.m(d.valuation)+" post ("+fmt.pct(d.checkSize/d.valuation*100)+" ownership)":""}. Stage: ${d.funnel}. Source: ${d.source}. Diligence gates: ${d.gates.filter(g=>g.status==="passed").length}/${d.gates.length} passed.`;
    m.terms = d.termSheet? Object.entries({Security:d.termSheet.security,"Pre-money":fmt.m(d.termSheet.preMoney),"Post-money":fmt.m(d.termSheet.postMoney),Investment:fmt.m(d.termSheet.investment),Ownership:fmt.pct(d.termSheet.ownership),"Liq. pref":d.termSheet.liquidation,"Anti-dilution":d.termSheet.antiDilution,Board:d.termSheet.board,"Pro-rata":d.termSheet.proRata,Dividends:d.termSheet.dividends,"Option pool":d.termSheet.optionPool,"Founder vesting":d.termSheet.founderVesting}).map(([k,v])=>`${k}: ${v}`).join("\n") : "Term sheet not yet issued. Proposed: "+fmt.m(d.checkSize)+(d.valuation?" at "+fmt.m(d.valuation)+" post.":"");
    m.risks = "- [Complete] Key diligence risks from open gates:\n" + d.gates.filter(g=>g.status!=="passed").map(g=>"  - "+g.name+" ("+g.status+")").join("\n");
    m.returns = d.valuation&&d.checkSize? `Entry: ${fmt.m(d.checkSize)} for ${fmt.pct(d.checkSize/d.valuation*100)}. Sketch: 3x exit (${fmt.m(d.valuation*3)}) returns ~${fmt.m(d.checkSize/d.valuation*d.valuation*3*0.75)} assuming 25% future dilution; 5x and 10x cases to model with full waterfall.`:"";
  }
  MEMO_SECTIONS.forEach(([k])=>{ if(!(k in m)) m[k]=""; });
  m.topgrading = m.topgrading || "Scorecard per key executive: mission, outcomes, competencies, reference summary (threshold: A-player bar).\n\nCEO -\nCTO -\nVP Sales -";
  m.reco = m.reco || "[Invest / Pass / Hold-follow-on] - recommended check, conditions precedent, proposed board role.";
  return m;
}

  const txt = `${DB.fund.name} - Summary ${new Date().toISOString().slice(0,10)}\nInvested ${fmt.m(m.invested)} across ${m.nActive} active companies; NAV ${fmt.m(m.fmv)}${isEvergreen()?"":"; distributions "+fmt.m(m.distributions)}.\n${line2}\nHealth: ${activeCompanies().filter(c=>c.health==="green").length} green / ${activeCompanies().filter(c=>c.health==="yellow").length} yellow / ${activeCompanies().filter(c=>c.health==="red").length} red. Platform pace: ${DB.fund.ytdPlatformsClosed}/${DB.fund.annualPlatformTarget} YTD.${m.fmvYoY!=null||m.leverage!=null?`\n${m.fmvYoY!=null?"FMV "+(m.fmvYoY>=0?"+":"")+m.fmvYoY.toFixed(1)+"% YoY"+(m.organicYoY!=null?" ("+fmt.m(m.organicYoY)+" organic)":"")+". ":""}${m.leverage!=null?"Leverage "+m.leverage.toFixed(1)+":1 ("+fmt.m(m.nbCapital)+" other NB capital, "+fmt.m(m.outsideCapital)+" outside capital in our rounds). ":""}${m.revenue?"Portfolio revenue "+fmt.m(m.revenue)+" run-rate"+(m.revQoQ!=null?" ("+(m.revQoQ>=0?"+":"")+m.revQoQ.toFixed(1)+"% same-store QoQ)":"")+". ":""}${m.fte?"Jobs "+m.fteNB.toLocaleString()+" in NB of "+m.fte.toLocaleString()+(m.fteAtEntry?" (+"+(m.fte-m.fteAtEntry).toLocaleString()+" since entry)":"")+". ":""}${m.womenCosPct!=null?"Women in C-suite at "+Math.round(m.womenCosPct)+"% of companies.":""}`:""}${(DB.fundInvestments||[]).length?(()=>{const fm=fiMetrics(); return `\nStrategic fund investments (separate): ${fm.n} LP positions, ${fmt.m(fm.committed)} committed (${fmt.m(fm.unfunded)} unfunded), NAV ${fmt.m(fm.nav)}, TVPI ${fmt.x(fm.tvpi)}, pooled IRR ${fmt.pct(fm.irr)}.`;})():""}`;

}

  f.text().then(txt=>{
    try{
      const d = JSON.parse(txt);
      if(!d.companies || !d.fund) throw new Error("Missing 'companies' or 'fund' keys");
      d.pipeline = d.pipeline||[]; d.fundInvestments = d.fundInvestments||[]; d.memos = d.memos||{}; d.meta = {schemaVersion:1, savedAt:null, demo:false};
      d.companies.forEach(c=>{ c.riskFlags=c.riskFlags||[]; c.kpis=c.kpis||[]; c.rounds=c.rounds||[]; c.marks=c.marks||[]; c.milestones=c.milestones||[]; c.covenants=c.covenants||[]; c.tasks=c.tasks||[]; c.board=c.board||{seat:"None",holder:"-",nextMeeting:null}; c.thresholds=c.thresholds||{minRunwayMo:12}; c.realized=c.realized||0; });
      DB = d; renderAll(); toast("Imported "+d.companies.length+" companies");
    }catch(e){ alert("Import failed: "+e.message); }
  });
}
function parseCsv(txt){
  const rows=[]; let row=[], cur="", inQ=false;
  for(let i=0;i<txt.length;i++){ const ch=txt[i];
    if(inQ){ if(ch==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=ch; }
    else if(ch==='"') inQ=true;
    else if(ch===","){ row.push(cur); cur=""; }
    else if(ch==="\n"||ch==="\r"){ if(cur!==""||row.length){ row.push(cur); rows.push(row); row=[]; cur=""; } if(ch==="\r"&&txt[i+1]==="\n") i++; }
    else cur+=ch; }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.length>1||r[0]!=="");
}
function importCsvFile(){
  const kind = $("#csvkind").value; const f = $("#csvfile").files[0];
  if(!f){ toast("Choose a .csv file first"); return; }
  f.text().then(txt=>{
    try{
      const rows = parseCsv(txt); const header = rows.shift().map(h=>h.trim().toLowerCase());
      const expected = CSV_SPECS[kind].split(",");
      const idx = {}; expected.forEach(col=>{ idx[col]=header.indexOf(col); if(idx[col]<0) throw new Error("Missing column: "+col); });
      const num = v => v===""||v==null? null : parseFloat(v);
      if(kind==="companies"){
        DB.companies = rows.map(r=>({ id:r[idx.id], name:r[idx.name], sector:r[idx.sector], stage:r[idx.stage], vintage:parseInt(r[idx.vintage])||null,
          instrument:r[idx.instrument], health:(r[idx.health]||"green").toLowerCase(), ownershipPct:num(r[idx.ownership_pct])||0,
          invested:num(r[idx.invested_m])||0, fmv:num(r[idx.fmv_m])||0, realized:num(r[idx.realized_m])||0,
          proRata:/^y/i.test(r[idx.pro_rata]||""), reservesAllocated:num(r[idx.reserves_allocated_m])||0, reservesDeployed:num(r[idx.reserves_deployed_m])||0,
          board:{seat:r[idx.board_seat]||"None", holder:r[idx.board_holder]||"-", nextMeeting:r[idx.next_meeting]||null},
          exited:/^y/i.test(r[idx.exited]||""), riskFlags:[], kpis:[], rounds:[], marks:[], milestones:[], covenants:[], tasks:[], govFunding:null,
          thresholds:{minRunwayMo:12}, ceo:"-", hq:"-", desc:"",
          source:r[idx.source]||"", fte:num(r[idx.fte])||0, fteNB:num(r[idx.fte_nb])||0, fteAtEntry:num(r[idx.fte_at_entry])||0,
          womenCSuite:num(r[idx.women_csuite])||0, cSuiteSize:num(r[idx.csuite_size])||0 }));
        DB.meta.demo=false;
      } else if(kind==="fund_investments"){
        DB.fundInvestments = rows.map(r=>({ id:r[idx.id], name:r[idx.name], manager:r[idx.manager]||"-", strategy:r[idx.strategy]||"-",
          vintage:parseInt(r[idx.vintage])||null, committed:num(r[idx.committed_m])||0, called:num(r[idx.called_m])||0,
          distributions:num(r[idx.distributions_m])||0, nav:num(r[idx.nav_m])||0,
          coInvestRights:/^y/i.test(r[idx.co_invest_rights]||""), coInvestsDone:0, referrals:0, capitalToDirect:num(r[idx.capital_to_direct_m])||0, womenSeniorGP:/^y/i.test(r[idx.women_senior_gp]||""),
          nextCallEst:r[idx.next_call_date]||null, agm:r[idx.agm_date]||null, contact:"", rationale:r[idx.rationale]||"", cashflows:[] }));
        DB.meta.demo=false;
      } else if(kind==="fund_cashflows"){
        rows.forEach(r=>{
          const f = (DB.fundInvestments||[]).find(x=>x.id===r[idx.fund_id]); if(!f) return;
          f.cashflows.push({date:r[idx.date], amount:num(r[idx.amount_m])||0});
        });
        (DB.fundInvestments||[]).forEach(f=>f.cashflows.sort((a,b)=>a.date<b.date?-1:1));
      } else {
        rows.forEach(r=>{
          const c = DB.companies.find(x=>x.id===r[idx.company_id]); if(!c) return;
          if(kind==="rounds") c.rounds.push({date:r[idx.date], label:r[idx.label], instrument:r[idx.instrument], invested:num(r[idx.invested_m])||0, roundTotal:num(r[idx.round_total_m]), nbOther:num(r[idx.nb_other_m]), postMoney:num(r[idx.post_money_m]), ownershipAfter:num(r[idx.ownership_after_pct])||0, lead:r[idx.lead]||"", note:r[idx.note]||""});
          if(kind==="marks") c.marks.push({date:r[idx.date], fmv:num(r[idx.fmv_m])||0, method:r[idx.method]||"", by:r[idx.marked_by]||"", rationale:r[idx.rationale]||""});
          if(kind==="kpis") c.kpis.unshift({period:r[idx.period], revenue:num(r[idx.revenue_m])||0, burn:num(r[idx.monthly_burn_m])||0, cash:num(r[idx.cash_m])||0, runwayMo:num(r[idx.runway_months])||0});
        });
        DB.companies.forEach(c=>{ c.rounds.sort((a,b)=>a.date<b.date?-1:1); c.marks.sort((a,b)=>a.date<b.date?1:-1); });
      }
      renderAll(); toast("Imported "+rows.length+" "+kind+" rows");
    }catch(e){ alert("CSV import failed: "+e.message); }
  });
}

/* ---- Affinity list-export import (fuzzy column mapping) ---- */
function mapAffinityStatus(s){
  const t = (s||"").toLowerCase();
  if(/diligen/.test(t)) return "Diligence";
  if(/term/.test(t)) return "Term Sheet";
  if(/\bic\b|committee|memo/.test(t)) return "IC Review";
  if(/won|closed|invested|portfolio/.test(t)) return "Closed";
  if(/pass|lost|dead|declin|reject/.test(t)) return "Passed";
  if(/screen|meeting|review|contact|active|evaluat/.test(t)) return "Screening";
  return "Sourced";
}
function seedGates(funnel){
  const depth = {"Sourced":0,"Screening":0,"Diligence":1,"IC Review":7,"Term Sheet":8,"Closed":9,"Passed":0}[funnel]||0;
  return DEFAULT_GATES.map((g,i)=>({name:g, status: i<depth?"passed": i===depth&&funnel!=="Sourced"&&funnel!=="Passed"?"in-progress":"pending"}));
}
function importAffinityCsv(){
  const f = $("#affinityfile").files[0]; if(!f){ toast("Choose the Affinity .csv first"); return; }
  f.text().then(txt=>{
    try{
      const rows = parseCsv(txt); if(rows.length<2) throw new Error("No data rows found");
      const header = rows.shift().map(h=>h.trim().toLowerCase());
      const find = (...pats)=>{ for(const p of pats){ const i=header.findIndex(h=>p.test(h)); if(i>=0) return i; } return -1; };
      const iName = find(/^(organization |company )?name$/, /organization/, /company/, /name/);
      if(iName<0) throw new Error("Could not find a Name / Organization Name column");
      const iStatus = find(/^status$/, /stage/, /status/);
      const iOwner = find(/owner/);
      const iAmt = find(/amount/, /deal size/, /check/, /round size/);
      const iSector = find(/industry/, /sector/);
      const iSource = find(/^source/, /sourced/, /referr/);
      const iDate = find(/date added/, /added/, /created/);
      const iNext = find(/next step/, /next action/, /notes?$/);
      const deals = rows.filter(r=>r[iName] && r[iName].trim()).map((r,ix)=>{
        const funnel = iStatus>=0? mapAffinityStatus(r[iStatus]) : "Sourced";
        let amt = null;
        if(iAmt>=0 && r[iAmt]){ amt = parseFloat(String(r[iAmt]).replace(/[$,\s]/g,"")); if(!isNaN(amt) && amt>100000) amt = amt/1e6; else if(isNaN(amt)) amt=null; } // raw dollars → $M
        return { id:"A"+String(ix+1).padStart(3,"0"), name:r[iName].trim(),
          sector: iSector>=0? (r[iSector]||"").trim()||"-" : "-",
          funnel, source: iSource>=0? (r[iSource]||"").trim()||"-" : "Affinity import",
          checkSize: amt, valuation: null,
          owner: iOwner>=0? (r[iOwner]||"").split(",")[0].trim()||"-" : "-",
          nextStep: iNext>=0? (r[iNext]||"").trim() : "",
          added: iDate>=0 && r[iDate]? (r[iDate].match(/\d{4}-\d{2}-\d{2}/)?.[0] || r[iDate].trim()) : "",
          gates: seedGates(funnel), termSheet:null,
          closedDate: funnel==="Closed"? (iDate>=0? r[iDate]:"") : undefined };
      });
      if(!deals.length) throw new Error("No usable rows");
      DB.pipeline = deals; DB.meta.demo = false;
      renderAll(); toast("Imported "+deals.length+" deals from Affinity");
    }catch(e){ alert("Affinity import failed: "+e.message); }
  });
}

/* ---- Reserves & follow-on allocation ---- */
function suggestedReserve(c){
  if(c.exited || !c.proRata || c.health==="red") return 0;
  const mult = c.health==="green"?0.8:0.5; // policy: 0.5-0.8x initial check
  const initial = c.rounds.length? c.rounds[0].invested : c.invested;
  return +(initial*mult).toFixed(1);
}

/* ---- Exit waterfall & dilution scenarios ---- */
function scenarioDefaults(c){
  const ev = c.ownershipPct>0? c.fmv/(c.ownershipPct/100) : (c.rounds.at(-1)?.postMoney||50);
  return {
    raise: +(Math.max(5, ev*0.2)).toFixed(0), pre: +(ev*1.2).toFixed(0), pool: 10,
    participate: c.proRata, partAmt: null, // null = pro-rata
    totalPref: +(ev*0.35).toFixed(0), yrs: 4,
    bear: +(ev*0.5).toFixed(0), base: +(ev*1.5).toFixed(0), bull: +(ev*3).toFixed(0)
  };
}
function runScenario(c, s){
  const post = s.pre + s.raise;
  const newInvPct = s.raise/post*100;
  const poolPct = s.pool;
  const dilutionFactor = 1 - newInvPct/100 - poolPct/100;
  const partAmt = s.participate? (s.partAmt!=null? s.partAmt : +(c.ownershipPct/100*s.raise).toFixed(2)) : 0;
  const ownAfter = c.ownershipPct*dilutionFactor + partAmt/post*100;
  const investedTotal = c.invested + partAmt;
  const ourPref = investedTotal; // 1x non-participating assumption
  const totalPref = Math.max(s.totalPref + partAmt + (s.raise - partAmt), ourPref); // stack grows by new round
  const proceedsAt = E => {
    if(E<=0) return 0;
    if(E <= totalPref) return E * (ourPref/totalPref);           // pari passu pref distribution
    return Math.max(ourPref, ownAfter/100 * E);                   // take greater of pref or converted
  };
  const mk = E => { const p=proceedsAt(E); const mo=investedTotal>0?p/investedTotal:0;
    const irr = s.yrs>0 && mo>0? (Math.pow(mo, 1/s.yrs)-1)*100 : null;
    return {E, p, mo, irr}; };
  return { post, newInvPct, poolPct, dilutionFactor, partAmt, ownAfter, investedTotal, ourPref, totalPref, proceedsAt,
    cases: [["Bear",mk(s.bear)],["Base",mk(s.base)],["Bull",mk(s.bull)]] };
}
function renderScenarioTool(){
  const act = activeCompanies().filter(c=>c.ownershipPct>0).sort((a,b)=>a.name.localeCompare(b.name));
  if(!MODEL.cid || !act.find(c=>c.id===MODEL.cid)) MODEL.cid = act[0]?.id;
  const c = act.find(x=>x.id===MODEL.cid); if(!c){ $("#model-body").innerHTML="<div class='small'>No active companies.</div>"; return; }
  if(!MODEL.inp || MODEL.inp._cid!==c.id){ MODEL.inp = scenarioDefaults(c); MODEL.inp._cid=c.id; }
  const s = MODEL.inp;
  const r = runScenario(c, s);
  const field = (label,key,step)=>`<div class="item"><div class="l">${label}</div><input type="number" step="${step||1}" value="${s[key]??""}" style="width:100%; border:1px solid var(--line); border-radius:5px; padding:4px 6px; margin-top:2px;" onchange="MODEL.inp['${key}']=parseFloat(this.value)||0; renderScenarioTool()"></div>`;
  $("#model-body").innerHTML = `
    <div class="fbar">
      <select onchange="MODEL.cid=this.value; MODEL.inp=null; renderScenarioTool()">${act.map(x=>`<option value="${x.id}" ${x.id===MODEL.cid?"selected":""}>${esc(x.name)}</option>`).join("")}</select>
      <button class="btn sm ghost" onclick="MODEL.inp=null; renderScenarioTool()">Reset inputs</button>
      <span class="count">Current: ${fmt.pct(c.ownershipPct)} ownership - ${fmt.m(c.invested)} cost - marked ${fmt.m(c.fmv)} (implied EV ${fmt.m(c.fmv/(c.ownershipPct/100))})</span>
    </div>
    <div class="grid" style="grid-template-columns: 320px 1fr;">
      <div class="card"><div class="chead">Assumptions</div><div class="cbody">
        <div class="dsec"><h4>Next Round</h4><div class="kv" style="grid-template-columns:1fr 1fr;">
          ${field("Raise $M","raise")}${field("Pre-money $M","pre")}${field("Pool expansion %","pool",0.5)}
          <div class="item"><div class="l">PARTICIPATE (PRO-RATA)</div><select style="width:100%; margin-top:2px; border:1px solid var(--line); border-radius:5px; padding:4px;" onchange="MODEL.inp.participate=this.value==='y'; renderScenarioTool()"><option value="y" ${s.participate?"selected":""}>Yes</option><option value="n" ${!s.participate?"selected":""}>No</option></select></div>
          ${s.participate?field("Override our $M (blank = pro-rata)","partAmt",0.1):""}
        </div></div>
        <div class="dsec"><h4>Exit</h4><div class="kv" style="grid-template-columns:1fr 1fr;">
          ${field("Bear exit $M","bear")}${field("Base exit $M","base")}${field("Bull exit $M","bull")}${field("Years to exit","yrs",0.5)}
          ${field("Pref stack today $M","totalPref")}
        </div></div>
        <div class="hint">Simplifications: 1x non-participating preference, pari passu stack, pool carved pre-money, no anti-dilution ratchets. Waterfall = greater of preference or as-converted at exit.</div>
      </div></div>
      <div>
        <div class="kpirow">
          <div class="kpi"><div class="k">Ownership After Round</div><div class="v">${fmt.pct(r.ownAfter)}</div><div class="s">from ${fmt.pct(c.ownershipPct)} (${r.partAmt>0?"+"+fmt.m(r.partAmt)+" follow-on":"no participation"})</div></div>
          <div class="kpi"><div class="k">Post-Money</div><div class="v">${fmt.m(r.post)}</div><div class="s">New money ${fmt.pct(r.newInvPct)} + pool ${fmt.pct(r.poolPct)}</div></div>
          <div class="kpi"><div class="k">Total Cost After</div><div class="v">${fmt.m(r.investedTotal)}</div><div class="s">Our 1x pref = ${fmt.m(r.ourPref)}</div></div>
          <div class="kpi"><div class="k">Pref Stack After</div><div class="v">${fmt.m(r.totalPref)}</div><div class="s">All preferred, pari passu</div></div>
        </div>
        <div class="card"><div class="chead">Scenario Outcomes</div><div class="cbody">
          <table class="dt"><thead><tr><th>Case</th><th class="num">Exit EV $M</th><th class="num">Our Proceeds $M</th><th class="num">MOIC</th><th class="num">IRR (${s.yrs}y)</th></tr></thead>
          <tbody>${r.cases.map(([n,x])=>`<tr><td><b>${n}</b></td><td class="num">${x.E.toFixed(0)}</td><td class="num">${x.p.toFixed(1)}</td><td class="num ${moicClass(x.mo)}"><b>${fmt.x(x.mo)}</b></td><td class="num">${x.irr!=null?fmt.pct(x.irr):"-"}</td></tr>`).join("")}</tbody></table>
        </div></div>
        <div class="card" style="margin-top:14px;"><div class="chead">Proceeds vs. Exit Value</div><div class="cbody"><div class="chartbox"><canvas id="ch-waterfall"></canvas></div></div></div>
      </div>
    </div>`;
  requestAnimationFrame(()=>{
    const maxE = Math.max(s.bull*1.25, 10); const pts=40;
    const xs=[], ys=[], cost=[];
    for(let i=0;i<=pts;i++){ const E=maxE*i/pts; xs.push(Math.round(E)); ys.push(+r.proceedsAt(E).toFixed(1)); cost.push(+r.investedTotal.toFixed(1)); }
    makeChart("ch-waterfall",{type:"line", data:{labels:xs, datasets:[
      {label:"Our proceeds", data:ys, borderColor:"#2563eb", backgroundColor:"rgba(37,99,235,.07)", fill:true, pointRadius:0, borderWidth:2, tension:.15},
      {label:"Our cost (breakeven)", data:cost, borderColor:"#b45309", borderDash:[5,4], pointRadius:0, borderWidth:1.5}]},
      options:{responsive:true,maintainAspectRatio:false, plugins:{legend:{position:"top"}},
        scales:{x:{title:{display:true,text:"Exit enterprise value ($M)"}, ticks:{maxTicksLimit:9}}, y:{title:{display:true,text:"$M"}}}}});
  });
}
